<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Thumbnail Design Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. UI THEME & TYPOGRAPHY --- */
        :root {
            --red-main: #ff1a1a;
            --red-glow: rgba(255, 26, 26, 0.8);
            --red-dark: #400000;
            --bg-darkest: #000000;
            --bg-dark: #1a0000;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Oswald', sans-serif;
            background: linear-gradient(to bottom right, var(--bg-dark), var(--red-dark), var(--bg-darkest));
            background-attachment: fixed; /* Keeps gradient steady while scrolling */
            color: #ffffff;
            overflow-x: hidden; /* Prevents horizontal scroll */
        }

        h1, h2, h3, .heading-font {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 2px;
            margin: 0;
        }

        /* --- PAGE TRANSITIONS (CSS) --- */
        .page {
            display: none; /* Hidden by default */
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            min-height: 100vh;
            width: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* JS toggles these classes to create smooth fades */
        .page.active-display { display: flex; }
        .page.active-opacity { opacity: 1; }

        /* --- GLOBAL BUTTON STYLES --- */
        .btn {
            background: transparent;
            color: #ffffff;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            padding: 12px 35px;
            border: 2px solid var(--red-main);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px var(--red-glow);
            box-shadow: 0 0 15px var(--red-glow), inset 0 0 5px var(--red-glow);
        }

        .btn:hover {
            background: var(--red-main);
            color: #ffffff;
            box-shadow: 0 0 25px var(--red-main), inset 0 0 15px var(--red-main);
            transform: scale(1.02);
        }

        .nav-header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 30px;
        }

        .btn-back {
            font-size: 1.2rem;
            padding: 8px 25px;
        }

        /* --- PAGE 1: LANDING --- */
        .pulse {
            animation: breathe 2s infinite ease-in-out;
        }

        @keyframes breathe {
            0% { transform: scale(1); box-shadow: 0 0 10px var(--red-glow), inset 0 0 5px var(--red-glow); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px var(--red-glow), inset 0 0 15px var(--red-glow); }
            100% { transform: scale(1); box-shadow: 0 0 10px var(--red-glow), inset 0 0 5px var(--red-glow); }
        }

        .hero-title {
            font-size: 4rem;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: #cccccc;
            margin-bottom: 50px;
            text-align: center;
            letter-spacing: 1px;
        }

        /* --- PAGE 2: CATEGORY SECTION --- */
        .category-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .category-card {
            background: rgba(10, 0, 0, 0.8);
            border: 2px solid #500000;
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .category-card:hover {
            border-color: var(--red-main);
            box-shadow: 0 0 25px var(--red-glow);
            transform: translateY(-8px);
        }

        /* This styles the placeholder visual if you don't have an image yet */
        .category-cover-placeholder {
            width: 100%;
            height: 250px; 
            background-color: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 1.2rem;
            border-bottom: 2px solid #220000;
        }

        /* Class for when you add your actual cover image */
        .category-cover-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            border-bottom: 2px solid #220000;
        }

        .category-title {
            padding: 25px;
            font-size: 2.2rem;
            color: #ffffff;
            text-shadow: 0 0 10px var(--red-glow);
        }

        /* --- PAGE 3: THE GALLERY --- */
        #page3 {
            justify-content: flex-start; /* Align to top for scrolling down */
        }

        .gallery-title {
            font-size: 3rem;
            color: #ffffff;
            text-shadow: 0 0 15px var(--red-glow);
            margin-bottom: 40px;
            text-align: center;
        }

        .gallery-wrapper {
            display: flex;
            flex-direction: column;
            gap: 50px; /* Space between thumbnails */
            width: 100%;
            max-width: 900px; /* Limits width on ultra-wide screens */
            align-items: center;
        }

        .gallery-item {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid #300000;
            transition: all 0.3s ease;
            object-fit: cover;
        }

        .gallery-item:hover {
            border-color: var(--red-main);
            box-shadow: 0 0 30px var(--red-glow);
            transform: scale(1.01);
        }

        /* Responsive Design Adjustments */
        @media (max-width: 600px) {
            .hero-title { font-size: 3rem; }
            .category-title { font-size: 1.8rem; }
            .gallery-title { font-size: 2.5rem; }
            .btn { font-size: 1.2rem; padding: 10px 25px; }
        }
    </style>
</head>
<body>

    <div id="page1" class="page active-display active-opacity">
        <h1 class="heading-font hero-title">THUMBNAIL DESIGN</h1>
        <p class="hero-subtitle">High-CTR Custom Minecraft Art</p>
        
        <button class="btn pulse" onclick="navigate('page1', 'page2')">VIEW PROJECTS</button>
    </div>


    <div id="page2" class="page">
        <div class="nav-header">
            <button class="btn btn-back" onclick="navigate('page2', 'page1')">&#8592; BACK</button>
        </div>
        
        <div class="category-container">
            <div class="category-card" onclick="navigate('page2', 'page3')">
                
                <div class="category-cover-placeholder">[ YOUR COVER ART HERE ]</div>
                
                <h2 class="heading-font category-title">MINECRAFT THUMBNAILS</h2>
            </div>
        </div>
    </div>


    <div id="page3" class="page">
        <div class="nav-header">
            <button class="btn btn-back" onclick="navigate('page3', 'page2')">&#8592; BACK TO CATEGORIES</button>
        </div>
        
        <h2 class="heading-font gallery-title">MY WORK</h2>
        
        <div class="gallery-wrapper">
            
            <img src="https://via.placeholder.com/1280x720/1a0000/ff1a1a?text=Thumbnail+1+Replace+Me" class="gallery-item" alt="Minecraft Thumbnail 1">
            
            <img src="https://via.placeholder.com/1280x720/1a0000/ff1a1a?text=Thumbnail+2+Replace+Me" class="gallery-item" alt="Minecraft Thumbnail 2">
            
            <img src="https://via.placeholder.com/1280x720/1a0000/ff1a1a?text=Thumbnail+3+Replace+Me" class="gallery-item" alt="Minecraft Thumbnail 3">
            
            <img src="https://via.placeholder.com/1280x720/1a0000/ff1a1a?text=Thumbnail+4+Replace+Me" class="gallery-item" alt="Minecraft Thumbnail 4">
            
            <img src="https://via.placeholder.com/1280x720/1a0000/ff1a1a?text=Thumbnail+5+Replace+Me" class="gallery-item" alt="Minecraft Thumbnail 5">

        </div>
    </div>


    <script>
        function navigate(fromPageId, toPageId) {
            const fromPage = document.getElementById(fromPageId);
            const toPage = document.getElementById(toPageId);

            // Step 1: Fade out the current page
            fromPage.classList.remove('active-opacity');
            
            // Step 2: Wait for fade out CSS transition (0.5s), then swap display
            setTimeout(() => {
                fromPage.classList.remove('active-display');
                toPage.classList.add('active-display');
                
                // Reset scroll to top before fading in the new page
                window.scrollTo(0, 0); 
                
                // Step 3: Slight delay to ensure 'display: flex' is applied before fading in
                setTimeout(() => {
                    toPage.classList.add('active-opacity');
                }, 50);

            }, 500); // 500ms matches the CSS 'transition: opacity 0.5s'
        }
    </script>

</body>
</html>
