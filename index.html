<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stzy's Notes Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base & Typography */
        body {
            font-family: 'Blonden';
            /* Soft, modern abstract gradient background */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 50%, #e0c3fc 100%);
            background-attachment: fixed;
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.8);
        }

        /* Button Glow Animation */
        .btn-glow {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            transition: box-shadow 0.3s ease, transform 0.2s ease;
        }

        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.8);
            transform: translateY(-2px);
        }

        /* Page Transitions */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-gray-800 p-4 md:p-8 overflow-x-hidden">

    <main id="app-container" class="w-full max-w-5xl glass-panel rounded-[2rem] p-8 md:p-14 min-h-[65vh] relative overflow-hidden flex flex-col items-center justify-center fade-in">

        <div id="page-home" class="w-full text-center flex flex-col items-center justify-center space-y-6">
            <div class="inline-block px-4 py-1.5 rounded-full glass-card text-sm font-medium text-blue-600 mb-2">v2.0 Beta Live</div>
            <h1 class="text-5xl md:text-7xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 tracking-tight pb-2">
                AI Notes Hub
            </h1>
            <p class="text-lg md:text-2xl font-light text-gray-600 max-w-2xl">
                Smart AI-generated notes for Class 9, 10, and 11
            </p>
            <button onclick="navigate('page-class')" class="mt-8 px-10 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-full font-semibold text-lg btn-glow focus:outline-none focus:ring-4 focus:ring-blue-300">
                Get Started
            </button>
        </div>

        <div id="page-class" class="hidden w-full flex-col items-center">
            <button onclick="navigate('page-home')" class="self-start mb-8 text-blue-600 font-semibold hover:text-blue-800 transition-colors flex items-center gap-2">
                ← Go Back
            </button>
            <h2 class="text-3xl md:text-4xl font-bold mb-10 text-gray-800 text-center tracking-tight">Select Your Class</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-4xl">
                <div onclick="selectClass('Class IX')" class="glass-card rounded-2xl p-12 cursor-pointer flex items-center justify-center text-2xl font-bold text-gray-700">Class IX</div>
                <div onclick="selectClass('Class X')" class="glass-card rounded-2xl p-12 cursor-pointer flex items-center justify-center text-2xl font-bold text-gray-700">Class X</div>
                <div onclick="selectClass('Class XI')" class="glass-card rounded-2xl p-12 cursor-pointer flex items-center justify-center text-2xl font-bold text-gray-700">Class XI</div>
            </div>
        </div>

        <div id="page-subject" class="hidden w-full flex-col items-center">
            <button onclick="navigate('page-class')" class="self-start mb-8 text-blue-600 font-semibold hover:text-blue-800 transition-colors flex items-center gap-2">
                ← Go Back
            </button>
            <h2 id="subject-title" class="text-3xl md:text-4xl font-bold mb-10 text-gray-800 text-center tracking-tight">Select Subject</h2>
            
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-5 w-full">
                <div onclick="navigate('page-pdf')" class="glass-card rounded-2xl p-8 cursor-pointer flex items-center justify-center text-lg font-semibold text-gray-700 text-center">English</div>
                <div onclick="navigate('page-pdf')" class="glass-card rounded-2xl p-8 cursor-pointer flex items-center justify-center text-lg font-semibold text-gray-700 text-center">Maths</div>
                <div onclick="navigate('page-pdf')" class="glass-card rounded-2xl p-8 cursor-pointer flex items-center justify-center text-lg font-semibold text-gray-700 text-center">Assamese</div>
                <div onclick="navigate('page-pdf')" class="glass-card rounded-2xl p-8 cursor-pointer flex items-center justify-center text-lg font-semibold text-gray-700 text-center">Science</div>
                <div onclick="navigate('page-pdf')" class="glass-card rounded-2xl p-8 cursor-pointer flex items-center justify-center text-lg font-semibold text-gray-700 text-center">Social Science</div>
            </div>
        </div>

        <div id="page-pdf" class="hidden w-full flex-col items-center">
            <button onclick="navigate('page-subject')" class="self-start mb-4 text-blue-600 font-semibold hover:text-blue-800 transition-colors flex items-center gap-2">
                ← Go Back
            </button>
            
            <div class="flex flex-col items-center justify-center w-full mt-4 glass-card rounded-[2rem] p-10 max-w-2xl text-center">
                <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mb-6 shadow-inner">
                    <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-gray-800 mb-3 tracking-tight">Your Notes are Ready!</h2>
                <p class="text-gray-500 max-w-md mb-8">Access your high-quality, AI-generated curriculum materials below.</p>
                
                <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
                    <button class="px-8 py-3.5 bg-white border border-gray-200 text-gray-700 rounded-xl font-medium hover:bg-gray-50 transition-colors shadow-sm w-full sm:w-auto">
                        Preview Notes
                    </button>
                    <button class="px-8 py-3.5 bg-blue-600 text-white rounded-xl font-medium btn-glow shadow-sm flex items-center justify-center gap-2 w-full sm:w-auto">
                        Download PDF
                    </button>
                </div>
            </div>
        </div>

    </main>

    <div id="secret-admin-btn" class="fixed bottom-0 right-0 w-[10px] h-[10px] bg-transparent z-50 cursor-pointer" title="Secret Area"></div>

    <div id="admin-modal" class="fixed inset-0 bg-black/30 backdrop-blur-sm hidden items-center justify-center z-50 opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md transform scale-95 transition-transform duration-300" id="admin-modal-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800 tracking-tight">Admin Upload</h3>
                <button id="close-admin" class="text-gray-400 hover:text-gray-800 transition-colors bg-gray-100 rounded-full p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <form onsubmit="event.preventDefault(); alert('Hypothetical PDF link uploaded successfully!'); closeAdmin();" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Select Class & Subject</label>
                    <select class="w-full border-gray-200 rounded-xl bg-gray-50 p-3 border focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                        <option>Class IX - Science</option>
                        <option>Class IX - Maths</option>
                        <option>Class X - Social Science</option>
                        <option>Class XI - English</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">PDF Link URL</label>
                    <input type="url" required class="w-full border-gray-200 rounded-xl bg-gray-50 p-3 border focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="https://drive.google.com/...">
                </div>
                <button type="submit" class="w-full mt-2 px-4 py-3.5 bg-gray-900 text-white rounded-xl font-medium hover:bg-black transition-colors shadow-lg">
                    Upload Link to Database
                </button>
            </form>
        </div>
    </div>

    <script>
        // Array of pages to handle clean SPA routing
        const pages = ['page-home', 'page-class', 'page-subject', 'page-pdf'];
        let selectedClass = '';

        // Navigation function
        function navigate(targetPageId) {
            pages.forEach(pageId => {
                const pageElement = document.getElementById(pageId);
                if (pageId === targetPageId) {
                    // Show target page
                    pageElement.classList.remove('hidden');
                    pageElement.classList.add('flex');
                    
                    // Re-trigger animation
                    pageElement.classList.remove('fade-in');
                    void pageElement.offsetWidth; // Trigger reflow
                    pageElement.classList.add('fade-in');
                } else {
                    // Hide other pages
                    pageElement.classList.add('hidden');
                    pageElement.classList.remove('flex', 'fade-in');
                }
            });
        }

        // Set dynamic title when class is selected
        function selectClass(className) {
            selectedClass = className;
            document.getElementById('subject-title').innerText = `${className} Subjects`;
            navigate('page-subject');
        }

        // Hidden Admin Feature Logic
        const secretBtn = document.getElementById('secret-admin-btn');
        const adminModal = document.getElementById('admin-modal');
        const adminModalContent = document.getElementById('admin-modal-content');
        const closeAdminBtn = document.getElementById('close-admin');

        // Open Modal
        secretBtn.addEventListener('click', () => {
            adminModal.classList.remove('hidden');
            adminModal.classList.add('flex');
            
            // Allow display block to apply before animating opacity/transform
            requestAnimationFrame(() => {
                adminModal.classList.remove('opacity-0');
                adminModalContent.classList.remove('scale-95');
                adminModalContent.classList.add('scale-100');
            });
        });

        // Close Modal
        function closeAdmin() {
            adminModal.classList.add('opacity-0');
            adminModalContent.classList.remove('scale-100');
            adminModalContent.classList.add('scale-95');
            
            // Wait for transition to finish before hiding display
            setTimeout(() => {
                adminModal.classList.add('hidden');
                adminModal.classList.remove('flex');
            }, 300);
        }

        // Event Listeners for closing modal
        closeAdminBtn.addEventListener('click', closeAdmin);
        adminModal.addEventListener('click', (e) => {
            if (e.target === adminModal) closeAdmin();
        });
    </script>
</body>
</html>
