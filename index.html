<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StzyWorks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #050505; 
            color: #ffffff; 
        }
        .logo-font { 
            font-family: 'Syne', sans-serif; 
        }
        html { 
            scroll-behavior: smooth; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <section id="home" class="flex-grow flex flex-col items-center justify-center text-center px-4 min-h-screen">
        <h1 class="text-6xl md:text-8xl font-extrabold logo-font tracking-tight">
            <span class="text-white">Stzy</span><span class="text-[#0066FF]">Works</span>
        </h1>
        
        <p class="mt-6 text-gray-400 max-w-2xl text-lg md:text-xl font-medium leading-relaxed">
            Crafting high-end digital experiences. Bridging the gap between cutting-edge AI architecture and striking visual design.
        </p>
        
        <a href="#works" class="mt-12 block w-full max-w-sm border border-[#0066FF] bg-transparent text-white py-2 text-center uppercase tracking-widest text-sm font-bold transition-colors duration-300 hover:bg-[#0066FF]">
            View Work
        </a>
    </section>

    <section id="works" class="py-24 px-6 md:px-12 min-h-screen bg-[#0a0a0a] flex flex-col justify-center">
        <div class="max-w-6xl w-full mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <div class="group relative bg-[#111111] border border-gray-800 aspect-video flex flex-col items-center justify-center transition-all hover:border-[#0066FF] cursor-pointer overflow-hidden">
                <div class="absolute inset-0 bg-[#0066FF] opacity-0 group-hover:opacity-10 transition-opacity"></div>
                <h3 class="text-2xl font-extrabold tracking-widest text-white group-hover:text-[#0066FF] transition-colors z-10">
                    THUMBNAILS
                </h3>
            </div>

            <div class="group relative bg-[#111111] border border-gray-800 aspect-video flex flex-col items-center justify-center transition-all hover:border-[#0066FF] cursor-pointer overflow-hidden">
                <div class="absolute inset-0 bg-[#0066FF] opacity-0 group-hover:opacity-10 transition-opacity"></div>
                <h3 class="text-2xl font-extrabold tracking-widest text-white group-hover:text-[#0066FF] transition-colors z-10">
                    LOGOS
                </h3>
            </div>

            <div class="group relative bg-[#111111] border border-gray-800 aspect-video flex flex-col items-center justify-center transition-all hover:border-[#0066FF] cursor-pointer overflow-hidden">
                <div class="absolute inset-0 bg-[#0066FF] opacity-0 group-hover:opacity-10 transition-opacity"></div>
                <h3 class="text-2xl font-extrabold tracking-widest text-white group-hover:text-[#0066FF] transition-colors z-10">
                    BANNERS
                </h3>
            </div>

        </div>
    </section>

</body>
</html>
